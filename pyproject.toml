[project]
name = "exam-pdf-parser"
version = "0.1.0"
description = "Extract multiple-choice questions from exam PDFs into validated Parquet/JSONL, measured against official answer data"
readme = "README.md"
authors = [
    { name = "Erick Bonruque", email = "bonruqueruck@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2023.7.22",
    "fonttools>=4.43",
    "pdfplumber>=0.11.0",
    "pyarrow>=16.0",
    "pydantic>=2.6",
    "requests>=2.31",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
    "types-requests>=2.33.0.20261030",
]

[project.scripts]
exam-pdf = "exam_pdf_parser.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
# These files are about glyphs: "×" and "−" are the characters under test.
"src/exam_pdf_parser/glyphs.py" = ["RUF001", "RUF002"]
"tests/test_glyphs.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["exam_pdf_parser", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pdfminer.*", "fontTools.*", "pyarrow.*"]
ignore_missing_imports = true
